<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
</head>
<body>
    <div id="main-container">

        <header>
            <form id="search-form">
                <input type="text" id="search-input" placeholder="Search your city" required>
                <button type="submit" id="search-btn">Search</button>
            </form>
        </header>

        <main id="weather-display">
            <div class="weather-card">
                <h2 id="city-name">Vigo</h2>
                <p id="weather-condition">Sunny</p>
                <div id="temp-container">
                    <span id="temperature">18</span>ºC
                </div>
            </div>
        </main>

        <div id="error-message" class="hidden">City not found. Please, try again.</div>

    </div>
</body>
</html>
